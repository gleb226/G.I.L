<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    
    
    <title>G.I.L Apartments - Оренда квартир подобово в Ужгороді</title>
    <meta name="description" content="Забронюйте комфортні апартаменти в Ужгороді подобово. Сучасний ремонт, центр міста.">
    <meta name="keywords" content="оренда квартир ужгород, квартири подобово ужгород, житло ужгород">
    <link rel="canonical" href="https://gil-apartments.com.ua/html/main.html">

    
    <meta property="og:type" content="website">
    <meta property="og:title" content="G.I.L Apartments - Комфортне житло подобово в Ужгороді">
    <meta property="og:description" content="Сучасні апартаменти в центрі Ужгорода. Фото, ціни та онлайн-бронювання.">
    <meta property="og:image" content="https://gil-apartments.com.ua/images/logo.png">

    
    <meta name="geo.region" content="UA-21">
    <meta name="geo.placename" content="Ужгород">

    <link rel="icon" type="image/jpeg" href="../images/logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="../images/logo.jpg">
    <link rel="apple-touch-icon" href="../images/logo.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/main.css">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LodgingBusiness",
      "name": "G.I.L Apartments",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Ужгород",
        "addressCountry": "UA"
      }
    }
    </script>
</head>
<body data-page="main" data-title-key="pages.main.title">
    <div data-site-header></div>

    <main class="main_catalog">
        <aside class="filter_bar" data-i18n="[aria-label]pages.main.filterBarAria">
            <button class="filter_button" type="button" id="filterToggle" aria-expanded="false" aria-controls="filterPanel" data-i18n="pages.main.filterToggle">Фільтр</button>
        </aside>

        <div class="filter_overlay" id="filterOverlay"></div>

        <section class="filter_panel" id="filterPanel" data-i18n="[aria-label]pages.main.filterPanelAria">
            <form class="filter_form" id="filterForm">
                <div class="filter_group">
                    <label for="rooms" data-i18n="pages.main.roomsLabel">Кількість кімнат</label>
                    <select id="rooms" name="rooms">
                        <option value="" data-i18n="pages.main.roomsAll">Всі оголошення</option>
                        <option value="1" data-i18n="pages.main.room1">1 кімната</option>
                        <option value="2" data-i18n="pages.main.room2">2 кімнати</option>
                        <option value="3" data-i18n="pages.main.room3">3 кімнати</option>
                    </select>
                </div>

                <div class="filter_group">
                    <label data-i18n="pages.main.priceLabel">Ціна</label>
                    <div class="filter_range">
                        <select name="price_from">
                            <option value="" data-i18n="pages.main.from">Від</option>
                            <option value="500">500</option>
                            <option value="800">800</option>
                            <option value="1000">1000</option>
                        </select>
                        <select name="price_to">
                            <option value="" data-i18n="pages.main.to">До</option>
                            <option value="1500">1500</option>
                            <option value="2000">2000</option>
                        </select>
                    </div>
                </div>

                <div class="filter_group">
                    <label data-i18n="pages.main.featuresLabel">Параметри</label>
                    <div class="filter_feature_list" id="featureFilters"></div>
                </div>

                <div class="filter_actions">
                    <button type="button" class="filter_action_button filter_action_clear" id="filterReset" data-i18n="common.actions.reset">Скинути</button>
                    <button type="submit" class="filter_action_button" data-i18n="common.actions.apply">Застосувати</button>
                </div>
            </form>
        </section>

        <section class="hero_flat">
            <a href="./appartments.html?id=111" class="hero_flat_link" id="heroFlatLink">
                <span class="hero_price_tag" id="heroPriceTag">1500 ₴ / день</span>
                <span class="hero_image_stage">
                    <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=1000" alt="Квартира" class="hero_flat_image hero_flat_image_current" id="heroFlatImageCurrent">
                </span>
            </a>
        </section>

        <section class="flats_catalog" id="flatsCatalog" data-i18n="[aria-label]pages.main.listAria"></section>
        <p class="catalog_empty" id="catalogEmpty" hidden data-i18n="pages.main.empty">За вашим фільтром квартири не знайдені.</p>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/i18next@24.2.3/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-i18next@1.2.1/jquery-i18next.min.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/appartments.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
